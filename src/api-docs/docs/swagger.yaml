# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan token JWT pada header Authorization (Bearer <token>)
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Otentikasi otomatis melalui httpOnly Cookie 'token'

  responses:
    SuccessResponse:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequestError:
      description: Request tidak valid / format salah (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Token tidak ada / tidak valid / expired (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Tidak memiliki hak akses ke resource ini (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Data atau endpoint tidak ditemukan (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Data duplikat / unique constraint violation (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validasi input gagal (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimitError:
      description: Terlalu banyak request, rate limit tercapai (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Operasi berhasil
        data:
          type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10

