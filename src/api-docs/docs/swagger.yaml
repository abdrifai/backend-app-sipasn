openapi: 3.0.3
info:
  title: SIPASN Backend API
  description: |
    Dokumentasi resmi REST API Sistem Informasi Manajemen Pegawai & ASN (SIPASN).
    Arsitektur backend menggunakan Express.js, Clean Architecture (Controller -> Service -> Repository), Prisma ORM, dan autentikasi JWT httpOnly Cookie / Bearer.
  version: 1.0.0
  contact:
    name: Tim Pengembang SIPASN
    email: support@sipasn.local
servers:
  - url: http://localhost:3000
    description: Server Development (Local)
  - url: /
    description: Current Server Host

tags:
  - name: Auth
    description: Endpoint autentikasi, login, logout, sesi pengguna, dan profil
  - name: Users
    description: Manajemen pengguna sistem dan hak akses (Admin only)
  - name: Pegawai
    description: Pencarian data pegawai, detail lengkap, statistik, dan laporan DUK
  - name: Ref Jabatan
    description: Master data jabatan ASN (Fungsional, Pelaksana, Jenjang, Jenis, Nama Lama, dan Master Jabatan)
  - name: Ref Unit Organisasi
    description: Master data struktur organisasi (Tree View, Unor Induk, Sub Unor, Sub Unor Sub, dan Unor)
  - name: Ref Pendidikan
    description: Master data referensi pendidikan dan tingkat pendidikan
  - name: Ref Diklat
    description: Master data referensi jenis dan jenjang diklat
  - name: Ref Kedudukan PNS
    description: Master data status & kedudukan pegawai ASN
  - name: Ref Jenis Mutasi
    description: Master data referensi jenis mutasi kepegawaian
  - name: Ref Jenis Hukuman
    description: Master data referensi tingkat dan jenis hukuman disiplin
  - name: Ref Instansi
    description: Master data referensi instansi pemerintah
  - name: DB Analysis
    description: Endpoint diagnostik dan analisis data database
  - name: Import PNS
    description: Endpoint untuk import data PNS dari file CSV, monitoring batch, dan manajemen data terimport

paths:

  # ==========================================
  # AUTH
  # ==========================================
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login pengguna
      description: Otentikasi pengguna menggunakan username/email dan password. Mengembalikan data user dan menyimpan JWT di httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout pengguna
      description: Menghapus token JWT cookie dan mengakhiri sesi aktif.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Dapatkan profil pengguna yang sedang login
      description: Mengembalikan data detail user dari sesi aktif berdasarkan token JWT.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Data pengguna aktif berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/profile:
    put:
      tags:
        - Auth
      summary: Perbarui profil pengguna aktif
      description: Memperbarui nama, email, username, password, atau foto profil pengguna yang sedang login.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                username:
                  type: string
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                photo:
                  type: string
                  format: binary
                  description: File foto profil (JPG/PNG/WebP, max 2MB)
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================
  # USERS (Admin)
  # ==========================================
  /api/users:
    get:
      tags:
        - Users
      summary: Daftar pengguna sistem
      description: Mengambil daftar pengguna sistem dengan pagination dan filter pencarian nama/email/username/role.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Nomor halaman
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Jumlah data per halaman
        - in: query
          name: search
          schema:
            type: string
          description: Kata kunci pencarian nama/email/username
        - in: query
          name: role
          schema:
            type: string
          description: Filter berdasarkan nama role
      responses:
        '200':
          description: Data pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags:
        - Users
      summary: Tambah pengguna baru
      description: Membuat akun pengguna sistem baru (Hak akses khusus Admin / Super Admin).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/roles:
    get:
      tags:
        - Users
      summary: Daftar roles
      description: Mengambil daftar semua role untuk opsi dropdown.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Daftar role berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Detail pengguna berdasarkan ID
      description: Mengambil data pengguna sistem berdasarkan ID.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data pengguna ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags:
        - Users
      summary: Perbarui pengguna sistem
      description: Memperbarui data pengguna berdasarkan ID (Admin only).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Data pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Users
      summary: Hapus pengguna sistem (Soft Delete)
      description: Melakukan soft delete akun pengguna (is_deleted = true).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pengguna berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # PEGAWAI
  # ==========================================
  /api/pegawai:
    get:
      tags:
        - Pegawai
      summary: Cari & daftar pegawai ASN
      description: Mengambil daftar pegawai ASN dengan filter pencarian NIP atau Nama, pagination, unit kerja, golongan, dan jenis jabatan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian NIP atau Nama pegawai
        - in: query
          name: unor_id
          schema:
            type: integer
          description: Filter ID Unit Kerja (Unor Induk)
        - in: query
          name: gol_id
          schema:
            type: integer
          description: Filter ID Golongan
        - in: query
          name: jnsjab_id
          schema:
            type: integer
          description: Filter ID Jenis Jabatan
      responses:
        '200':
          description: Data pegawai berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Pegawai
      summary: Tambah pegawai baru
      description: Membuat data pegawai dan data orang baru di sistem secara atomic.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama
                - nipBaru
                - t4Lhr
                - tglLhr
                - jkl_id
              properties:
                nama:
                  type: string
                  example: "Ahmad Dahlan, S.Kom."
                nipBaru:
                  type: string
                  example: "199001012020121001"
                nipLama:
                  type: string
                  example: "132000111"
                nik:
                  type: string
                  example: "7209010101900001"
                kk:
                  type: string
                  example: "7209010101900002"
                t4Lhr:
                  type: string
                  example: "AMPANA"
                tglLhr:
                  type: string
                  format: date
                  example: "1990-01-01"
                jkl_id:
                  type: string
                  enum: ["1", "2"]
                  example: "1"
                agama_id:
                  type: string
                  example: "1"
                kawin_id:
                  type: string
                  example: "2"
                golDarah:
                  type: string
                  example: "O"
                npwp:
                  type: string
                  example: "12.345.678.9-012.000"
                email:
                  type: string
                  example: "ahmad@mail.com"
                no_hp:
                  type: string
                  example: "081234567890"
                alamat:
                  type: string
                  example: "Jl. Merdeka No. 10, Ampana"
      responses:
        '201':
          description: Pegawai baru berhasil ditambahkan
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: NIP pegawai sudah ada

  /api/pegawai/referensi/identitas:
    get:
      tags:
        - Pegawai
      summary: Master referensi identitas pegawai
      description: Mengambil daftar agama, status perkawinan, jenis kelamin, kedudukan PNS, dan status PNS.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Data referensi identitas berhasil diambil

  /api/pegawai/stats:
    get:
      tags:
        - Pegawai
      summary: Statistik global pegawai ASN
      description: Mengambil ringkasan statistik total ASN, PNS aktif, sebaran golongan, jenis kelamin, dan jabatan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Statistik berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pegawai/migration-stats:
    get:
      tags:
        - Pegawai
      summary: Statistik migrasi jabatan
      description: Mengambil ringkasan statistik perbandingan jabatan lama dan jabatan baru setelah migrasi Perpres.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Statistik migrasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pegawai/duk:
    get:
      tags:
        - Pegawai
      summary: Laporan Daftar Urut Kepangkatan (DUK)
      description: Mengambil data urutan kepangkatan ASN berdasarkan golongan, eselon, jabatan, masa kerja, dan pendidikan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: unor_id
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Data DUK berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiListResponse'

  /api/pegawai/duk/export:
    get:
      tags:
        - Pegawai
      summary: Export Laporan DUK ke Excel
      description: Menghasilkan dan mendownload file spreadsheet Excel (.xlsx) data Daftar Urut Kepangkatan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: unor_id
          schema:
            type: integer
      responses:
        '200':
          description: File Excel DUK berhasil diunduh
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/pegawai/referensi/golongan:
    get:
      tags:
        - Pegawai
      summary: Daftar referensi master golongan dan jenis KP
      description: Mengambil daftar opsi referensi golongan (ref_gol) dan jenis KP (ref_jnskp) untuk form input peremajaan riwayat golongan.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Daftar referensi berhasil diambil

  /api/pegawai/{id}:
    get:
      tags:
        - Pegawai
      summary: Detail lengkap profil pegawai ASN
      description: Mengambil detail profil pegawai mencakup Identitas, Riwayat Jabatan & SK, Riwayat Pendidikan, Riwayat Diklat, dan Perhitungan Masa Kerja.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Pegawai (ta_pegawai.id)
      responses:
        '200':
          description: Detail data pegawai ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PegawaiDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/pegawai/{id}/identitas:
    put:
      tags:
        - Pegawai
      summary: Update identitas pegawai
      description: Memperbarui data identitas pribadi dan kepegawaian ASN secara atomic.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                nipBaru:
                  type: string
                nipLama:
                  type: string
                nik:
                  type: string
                kk:
                  type: string
                t4Lhr:
                  type: string
                tglLhr:
                  type: string
                  format: date
                jkl_id:
                  type: string
                agama_id:
                  type: string
                kawin_id:
                  type: string
                golDarah:
                  type: string
                npwp:
                  type: string
                email:
                  type: string
                no_hp:
                  type: string
                alamat:
                  type: string
                karpeg:
                  type: string
                taspen:
                  type: string
                bpjs:
                  type: string
                kedudukanPns_id:
                  type: integer
      responses:
        '200':
          description: Identitas pegawai berhasil diperbarui
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: NIP baru sudah digunakan oleh pegawai lain

  /api/pegawai/{id}/foto:
    put:
      tags:
        - Pegawai
      summary: Upload dan perbarui foto profil pegawai
      description: Mengunggah file foto baru untuk pegawai (JPG/PNG/WebP, max 2MB) dan menghapus foto lama jika ada.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Pegawai
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - foto
              properties:
                foto:
                  type: string
                  format: binary
                  description: File foto pegawai (JPG/PNG/WebP, max 2MB)
      responses:
        '200':
          description: Foto pegawai berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Foto pegawai berhasil diperbarui
                  data:
                    type: object
                    properties:
                      pegawaiId:
                        type: string
                      foto:
                        type: string
                        example: storage/profile-foto/foto-pegawai-123-1718000000000.jpg
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Pegawai
      summary: Hapus foto profil pegawai
      description: Menghapus file foto pegawai dan mengatur foto menjadi null.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Pegawai
      responses:
        '200':
          description: Foto pegawai berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/pegawai/{id}/riwayat-golongan:
    post:
      tags:
        - Pegawai
      summary: Tambah riwayat golongan pegawai
      description: Menambahkan riwayat kenaikan pangkat / golongan baru untuk pegawai. Jika merupakan TMT terbaru, otomatis mensinkronkan golongan aktif pegawai.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID Pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gol_id
                - tglSk
                - tmtSk
              properties:
                gol_id:
                  type: string
                  example: "41"
                sk:
                  type: string
                  example: "823/123/BKPSDM/2024"
                tglSk:
                  type: string
                  format: date
                  example: "2024-03-15"
                tmtSk:
                  type: string
                  format: date
                  example: "2024-04-01"
                maskerThn:
                  type: string
                  example: "12"
                maskerBln:
                  type: string
                  example: "6"
                pertekBkn:
                  type: string
                  example: "PK-12345/BKN/2024"
                tglPertek:
                  type: string
                  format: date
                  example: "2024-03-01"
                jnsKp_id:
                  type: integer
                  example: 1
                gapok:
                  type: integer
                  example: 3500000
                pengesahan:
                  type: string
                  example: "Bupati"
      responses:
        '201':
          description: Riwayat golongan berhasil ditambahkan
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/pegawai/{id}/riwayat-golongan/{rwtGolId}:
    put:
      tags:
        - Pegawai
      summary: Update riwayat golongan pegawai
      description: Memperbarui data riwayat golongan tertentu milik pegawai.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: rwtGolId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Riwayat golongan berhasil diperbarui
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Pegawai
      summary: Hapus riwayat golongan pegawai
      description: Menghapus data riwayat golongan tertentu milik pegawai.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: rwtGolId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Riwayat golongan berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/pegawai/{id}/riwayat-kgb:
    post:
      tags:
        - Pegawai
      summary: Tambah riwayat KGB pegawai
      description: Menambahkan data riwayat kenaikan gaji berkala (KGB) baru untuk pegawai beserta opsi unggah dokumen SK PDF.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tglSk
                - tmtSk
                - gapok
              properties:
                dokumen_sk:
                  type: string
                  format: binary
                gol_id:
                  type: string
                  example: "41"
                sk:
                  type: string
                  example: "822/01/KGB/2024"
                tglSk:
                  type: string
                  format: date
                  example: "2024-03-15"
                tmtSk:
                  type: string
                  format: date
                  example: "2024-04-01"
                maskerThn:
                  type: string
                  example: "12"
                maskerBln:
                  type: string
                  example: "0"
                gapok:
                  type: integer
                  example: 3650000
                pengesahan:
                  type: string
                  example: "Kepala Dinas"
      responses:
